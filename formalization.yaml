        LP/PSD dual certificate discovery, small-integer unit-triangular rounding, and Lean 4
        (v4.35.0-rc2) + Mathlib formalization verified by lake comparator (Lean kernel,
        nanoda, and con-ron).
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "Problem selection and direction by human maintainer; mathematical discovery, certificate compression, and Lean 4 formalization performed by AI agents."
  spend_usd: "not tracked"
  notes: >-
    Dual certificates were found in Python, rounded to compact pure integers via unit-triangular
    residual absorption, and checked directly inside Lean's kernel via j-sliced `by decide`
    lemmas (with zero `native_decide` and default `maxHeartbeats`).

fidelity:
  divergences: >-
    In Challenge.lean, `degSensitivityExponent` is defined as the asymptotic infimum
    `inf { alpha | s(f) = O(deg(f)^alpha) }`, whereas Tao's #37a page defines
    `C_37 = sup_{deg(f) > 1} log(s(f)) / log(deg(f))`. The theorem
    `kushilevitz_exponent_lower_bound` establishes `log 6 / log 3 <= degSensitivityExponent`
    (which is the tighter asymptotic quantity), while `kushilevitz_witness` directly gives
    the finite supremum bound `log 6 / log 3 <= C_37`. All fixed-degree upper bounds
    `B_2 .. B_9` match the standard definition verbatim.

