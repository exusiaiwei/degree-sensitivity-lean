status:
  scope: >-
    Formalizes BooleanFun, sensitivityAt, maxSensitivity, RepresentsPoly, polyDegree,
    degSensitivityExponent, explicit witnesses (3, 2, 3), (6, 3, 6), (9, 4, 9), (13, 5, 13),
    asymptotic lower bound log 6 / log 3 <= degSensitivityExponent, sharp bounds B_2 = 3,
    B_3 = 6, B_4 = 9, and sharpened upper bounds B_5 <= 14, B_6 <= 20, B_7 <= 28,
    B_8 <= 36, B_9 <= 46 with zero sorry in Solution.lean and zero native_decide.
    Does not resolve the open case (n = 14, d = 5) or alter the asymptotic bounds
    log_3 6 <= C_37 <= 2.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

