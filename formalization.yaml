  reviewers:
    - "exusiaiwei (direction, scope check, and Challenge.lean sign-off)"
    - "AI verification agents (independent pure-Python Fraction certificate checkers)"
  notes: >-
    All Challenge.lean definitions use only standard Mathlib primitives (`Fin`, `Finset`,
    `MvPolynomial`, `Real.log`, `sInf`), and sensitivity matches `leanprover/cslib`.
    All 13 advertised theorems in Solution.lean pass `scripts/verify-comparator.sh`
    across Lean's default kernel, nanoda, and con-ron (49,012 declarations `--verified`)
    using only `[propext, Quot.sound, Classical.choice]`.

