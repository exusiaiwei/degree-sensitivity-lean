version: "v0.4"

project:
  name: "DegreeSensitivity: Sharp Low-Degree Sensitivity Bounds for Boolean Functions"
  description: >-
    Lean 4 formalization of sensitivity-versus-real-degree bounds for Boolean functions
    f : {0, 1}^n -> {0, 1}, motivated by Terence Tao's Optimization Constant #37a.
    Establishes exact real polynomial degree via Boolean-lattice Mobius inversion,
    explicit kernel-verified witnesses (3, 2, 3), (6, 3, 6), (9, 4, 9), and (13, 5, 13),
    the asymptotic lower bound log 6 / log 3 <= degSensitivityExponent via iterated
    composition and the Chebyshev cubic upper bound, exact sharp bounds B_2 = 3, B_3 = 6,
    a zero-search 10-line elementary algebraic proof of B_4 = 9, and sharpened low-degree
    upper bounds B_5 <= 14, B_6 <= 20, B_7 <= 28, B_8 <= 36, and B_9 <= 46 strictly
    improving the univariate symmetrisation LP bounds of Wellens (2022) via pure-integer
    Terwilliger LP/PSD certificates, sum-of-squares rigidity, and forbidden-subgraph arguments.
    These fixed-degree bounds do not alter the asymptotic exponent bounds log_3 6 <= C_37 <= 2.
  authors:
    - "exusiaiwei"
  license: "Apache-2.0"
  responsible_maintainers:
    - "exusiaiwei"

classification:
  arxiv: ["math.CO", "cs.CC"]
  msc2020: ["06E30", "68Q17", "05C35"]

sources:
  - title: "Sharpened low-degree sensitivity bounds for Boolean functions via Terwilliger LP/PSD, SOS rigidity, and forbidden subgraphs"
    type: "original-proof"
    relationship: "other"
    note: >-
      Original Lean 4 formal proofs strictly improving the univariate symmetrisation LP
      bounds of Wellens (2022, Table 1) at degrees 5 through 9: B_5 <= 14 (from 15),
      B_6 <= 20 (from 21), B_7 <= 28 (from 29), B_8 <= 36 (from 38), and B_9 <= 46 (from 47),
      together with an elementary zero-search 10-line algebraic proof of sharp B_4 = 9
      (previously proved via a 479-leaf MILP branch-and-bound certificate by Koshta, 2026)
      and an explicit weighted-composition (13, 5, 13) witness giving 13 <= B_5 <= 14.
  - title: "Relationships between the number of inputs and other complexity measures of Boolean functions"
    authors:
      - "Jake Wellens"
    id: "arXiv:2005.00566"
    type: "article"
    location: "https://arxiv.org/abs/2005.00566"
    relationship: "background"
    note: "Published in Discrete Analysis 2022:20; establishes the univariate symmetrisation LP bounds B_4 <= 10, B_5 <= 15, B_6 <= 21, B_7 <= 29, B_8 <= 38, B_9 <= 47."
  - title: "On the degree of Boolean functions as real polynomials"
    authors:
      - "Noam Nisan"
      - "Mario Szegedy"
    type: "article"
    location: "Computational Complexity 4 (1994), 301-313"
    relationship: "background"
    note: "Foundational degree-sensitivity lower bounds and symmetrisation framework."
  - title: "On rank vs. communication complexity"
    authors:
      - "Noam Nisan"
      - "Avi Wigderson"
    type: "article"
    location: "Combinatorica 15 (1995), 557-565"
    relationship: "background"
    note: "Footnote 1 introduces Kushilevitz's 6-variable degree-3 function with sensitivity 6."
  - title: "Optimization Problems #37a (The degree-sensitivity exponent)"
    authors:
      - "Terence Tao"
    type: "web post"
    location: "https://teorth.github.io/optimizationproblems/constants/37a.html"
    relationship: "background"
    note: "Problem statement and literature tracker for Tao's Constant #37a, including Koshta (2026) on degree 4."

